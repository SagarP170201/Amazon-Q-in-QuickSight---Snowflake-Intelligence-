name: xpressbees_profitability
description: XpressBees B2B logistics profitability analysis covering revenue, cost, margin, yield, CPK, and volume metrics.
tables:
- name: b2b_revenue
  description: Primary fact table with AWB-level revenue, cost breakdowns, margin, weights, and geography.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: B2B_REVENUE
  dimensions:
  - name: awb_no
    expr: '"AWB No"'
    description: Air Waybill number - unique shipment identifier
    synonyms:
    - awb
    - shipment number
    data_type: TEXT
  - name: client_name
    expr: '"Client Name"'
    description: Name of the client or customer
    synonyms:
    - customer name
    - customer
    - client
    data_type: TEXT
  - name: client_group
    expr: '"Client Group"'
    description: Client group or parent company
    synonyms:
    - customer group
    data_type: TEXT
  - name: client_id
    expr: '"Client ID"'
    description: Unique client identifier
    synonyms:
    - customer id
    data_type: TEXT
  - name: route
    expr: '"Route"'
    description: Shipment route classification
    synonyms:
    - route type
    - national regional
    sample_values:
    - National
    - Regional
    data_type: TEXT
  - name: origin_city
    expr: '"Origin_City"'
    description: City of shipment origin
    synonyms:
    - origin
    - source city
    - from city
    data_type: TEXT
  - name: dest_city
    expr: '"Dest_City"'
    description: City of shipment destination
    synonyms:
    - destination
    - destination city
    - to city
    data_type: TEXT
  - name: territory
    expr: '"Territory"'
    description: Primary territory assignment
    synonyms:
    - terr
    data_type: TEXT
  - name: zone
    expr: '"Zone"'
    description: Zone assignment
    synonyms:
    - region
    data_type: TEXT
  - name: tsm_name
    expr: '"TSM.Name"'
    description: Territory Sales Manager name
    synonyms:
    - tsm
    data_type: TEXT
  - name: zsm_name
    expr: '"ZSM.Name"'
    description: Zonal Sales Manager name
    synonyms:
    - zsm
    data_type: TEXT
  - name: origin_territory
    expr: '"Origin_Terr"'
    description: Territory of origin city
    data_type: TEXT
  - name: dest_territory
    expr: '"Dest_Terr"'
    description: Territory of destination city
    data_type: TEXT
  - name: revenue_type
    expr: '"Revenue Type"'
    description: Billing classification
    data_type: TEXT
  - name: density_bucket
    expr: '"Density Bucket"'
    description: Shipment density bucket
    data_type: TEXT
  - name: origin_hub_name
    expr: '"Origin HubName"'
    description: Origin hub name
    data_type: TEXT
  - name: destination_hub_name
    expr: '"Destination HubName"'
    description: Destination hub name
    data_type: TEXT
  - name: national_regional
    expr: CASE WHEN "Origin_Terr" != "Dest_Terr" THEN 'National' ELSE 'Regional' END
    description: National (cross-territory) vs Regional (same territory) classification
    synonyms:
    - national
    - regional
    - national vs regional
    - route type
    sample_values:
    - National
    - Regional
    data_type: TEXT
  time_dimensions:
  - name: pickup_date
    expr: TRY_TO_TIMESTAMP("PICKUPDATE")
    description: Shipment pickup date
    data_type: TIMESTAMP
    synonyms:
    - pickup date
  - name: delivery_date
    expr: TRY_TO_DATE("Del Date")
    description: Delivery date
    data_type: DATE
    synonyms:
    - del date
  - name: inscan_date
    expr: TRY_TO_TIMESTAMP("InScan Date")
    description: InScan date
    data_type: TIMESTAMP
  facts:
  - name: net_charges
    expr: TRY_TO_NUMBER("Net Charges", 18, 2)
    description: Total net revenue charges
    synonyms:
    - revenue
    - net revenue
    data_type: NUMBER
  - name: total_cost
    expr: TRY_TO_NUMBER("Total Cost", 18, 2)
    description: Total cost of the shipment
    synonyms:
    - cost
    data_type: NUMBER
  - name: margin_value
    expr: TRY_TO_NUMBER("Margin", 18, 2)
    description: Pre-calculated margin (Net Charges - Total Cost)
    synonyms:
    - margin
    - profit
    data_type: NUMBER
  - name: tot_chrgwt
    expr: TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)
    description: Total billed weight in kg
    synonyms:
    - billed weight
    - volume
    - weight
    data_type: NUMBER
  - name: tot_phywt
    expr: TRY_TO_NUMBER("TOT_PHYWT", 18, 4)
    description: Total physical weight in kg
    data_type: NUMBER
  - name: tot_volwt
    expr: TRY_TO_NUMBER("TOT_VOLWT", 18, 4)
    description: Total volumetric weight
    data_type: NUMBER
  - name: pickup_cost
    expr: TRY_TO_NUMBER("Pickup Cost", 18, 2)
    description: Total pickup cost
    data_type: NUMBER
  - name: delivery_cost
    expr: TRY_TO_NUMBER("Delivery Cost", 18, 2)
    description: Total delivery cost
    data_type: NUMBER
  - name: linehaul_cost
    expr: TRY_TO_NUMBER("Linehaul Cost", 18, 2)
    description: Linehaul transportation cost
    synonyms:
    - lh cost
    data_type: NUMBER
  - name: midmile_cost
    expr: TRY_TO_NUMBER("Midmile Cost", 18, 2)
    description: Mid-mile transportation cost
    synonyms:
    - mm cost
    data_type: NUMBER
  - name: handling_cost
    expr: TRY_TO_NUMBER("Handling Cost", 18, 2)
    description: Total handling cost
    data_type: NUMBER
  - name: common_costs
    expr: TRY_TO_NUMBER("Common Costs", 18, 2)
    description: Common overhead costs
    data_type: NUMBER
  - name: other_costs
    expr: TRY_TO_NUMBER("Other Costs", 18, 2)
    description: Other miscellaneous costs
    data_type: NUMBER
  - name: credit_notes
    expr: TRY_TO_NUMBER("Credit Notes", 18, 2)
    description: Credit note value
    data_type: NUMBER
  - name: freight
    expr: TRY_TO_NUMBER("Freight", 18, 2)
    description: Base freight charges
    data_type: NUMBER
  - name: fm_handling
    expr: TRY_TO_NUMBER("FM handling", 18, 2)
    description: First mile handling cost
    data_type: NUMBER
  - name: lm_handling
    expr: TRY_TO_NUMBER("LM Handling", 18, 2)
    description: Last mile handling cost
    data_type: NUMBER
  - name: mm_handling
    expr: TRY_TO_NUMBER("MM Handling", 18, 2)
    description: Mid mile handling cost
    data_type: NUMBER
  - name: milkrun_cost
    expr: TRY_TO_NUMBER("Milkrun Cost", 18, 2)
    description: Milkrun delivery cost
    data_type: NUMBER
  - name: feeder_cost
    expr: TRY_TO_NUMBER("Feeder Cost - From Pickup branch / Hub till LH Hub", 18, 2)
    description: Feeder cost to linehaul hub
    data_type: NUMBER
  - name: demurrage_charges
    expr: TRY_TO_NUMBER("Demurrage Charges", 18, 2)
    description: Demurrage penalty charges
    data_type: NUMBER
  - name: density
    expr: TRY_TO_NUMBER("Density", 18, 4)
    description: Shipment density
    data_type: NUMBER
  metrics:
  - name: total_revenue
    expr: SUM(TRY_TO_NUMBER("Net Charges", 18, 2))
    description: Total revenue across all AWBs
    synonyms:
    - revenue
  - name: total_cost_metric
    expr: SUM(TRY_TO_NUMBER("Total Cost", 18, 2))
    description: Total cost across all AWBs
  - name: total_margin
    expr: SUM(TRY_TO_NUMBER("Margin", 18, 2))
    description: Total margin
    synonyms:
    - margin
    - profit
  - name: margin_percentage
    expr: SUM(TRY_TO_NUMBER("Margin", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("Net Charges", 18, 2)), 0) * 100
    description: Margin as percentage of revenue
    synonyms:
    - margin pct
    - margin %
  - name: cpk
    expr: SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)), 0)
    description: Cost Per Kg
    synonyms:
    - cost per kg
  - name: yield_rpk
    expr: SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)), 0)
    description: Yield or Revenue Per Kg
    synonyms:
    - yield
    - rpk
    - revenue per kg
  - name: total_volume
    expr: SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4))
    description: Total billed weight volume in kg
    synonyms:
    - volume
    - total weight
  - name: shipment_count
    expr: COUNT("AWB No")
    description: Number of shipments
    synonyms:
    - awb count
    - shipments
  - name: unique_customers
    expr: COUNT(DISTINCT "Client Name")
    description: Number of unique customers
  - name: total_pickup_cost
    expr: SUM(TRY_TO_NUMBER("Pickup Cost", 18, 2))
    description: Total pickup cost
  - name: total_delivery_cost
    expr: SUM(TRY_TO_NUMBER("Delivery Cost", 18, 2))
    description: Total delivery cost
  - name: total_linehaul_cost
    expr: SUM(TRY_TO_NUMBER("Linehaul Cost", 18, 2))
    description: Total linehaul cost
  - name: total_midmile_cost
    expr: SUM(TRY_TO_NUMBER("Midmile Cost", 18, 2))
    description: Total midmile cost
  - name: total_handling_cost
    expr: SUM(TRY_TO_NUMBER("Handling Cost", 18, 2))
    description: Total handling cost
  primary_key:
    columns:
    - awb_no
- name: awb_file
  description: AWB to Promised Delivery Date mapping.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: AWB_FILE
  dimensions:
  - name: parentawbno
    expr: '"parentawbno"'
    description: Parent AWB number
    data_type: TEXT
  time_dimensions:
  - name: pdd
    expr: TRY_TO_TIMESTAMP("pdd")
    description: Promised delivery date
    data_type: TIMESTAMP
  primary_key:
    columns:
    - parentawbno
- name: fm_journey
  description: First mile journey details.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: FM_JOURNEY
  dimensions:
  - name: awb
    expr: TRIM("AWB")
    description: AWB number
    data_type: TEXT
  - name: fm_tripid
    expr: '"FM_TRIPID"'
    description: First mile trip ID
    data_type: TEXT
  - name: originhub
    expr: '"ORIGINHUB"'
    description: Origin hub
    data_type: TEXT
  - name: pickuppincode
    expr: '"PICKUPPINCODE"'
    description: Pickup pincode
    data_type: TEXT
  - name: oda_normal
    expr: '"ODA/NORMAL"'
    description: ODA or Normal classification
    data_type: TEXT
  time_dimensions:
  - name: pickupdate
    expr: TRY_TO_TIMESTAMP("PICKUPDATE")
    description: Pickup date
    data_type: TIMESTAMP
  primary_key:
    columns:
    - awb
- name: lm_journey
  description: Last mile journey details.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: LM_JOURNEY
  dimensions:
  - name: awb
    expr: TRIM("AWB")
    description: AWB number
    data_type: TEXT
  - name: lm_tripid
    expr: '"LM_TRIPID"'
    description: Last mile trip ID
    data_type: TEXT
  - name: desthub
    expr: '"DESTHUB"'
    description: Destination hub
    data_type: TEXT
  - name: deliverypincode
    expr: '"DELIVERYPINCODE"'
    description: Delivery pincode
    data_type: TEXT
  - name: oda_normal_lm
    expr: '"ODA/NORMAL"'
    description: ODA or Normal
    data_type: TEXT
  - name: appt_normal
    expr: '"APPT/NORMAL"'
    description: Appointment or Normal
    data_type: TEXT
  time_dimensions:
  - name: deliverydatetime
    expr: TRY_TO_TIMESTAMP("DELIVERYDATETIME")
    description: Delivery date and time
    data_type: TIMESTAMP
  facts:
  - name: totalattemptcount
    expr: TRY_TO_NUMBER("TOTALATTEMPTCOUNT")
    description: Total delivery attempts
    data_type: NUMBER
  primary_key:
    columns:
    - awb
- name: mm_journey
  description: Mid-mile journey details — trip connections, loading/unloading hubs, connection types.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: MM_JOURNEY
  dimensions:
  - name: mm_awb
    expr: TRIM(AWB)
    description: AWB number
    data_type: TEXT
  - name: mm_tripid
    expr: MM_TRIPID
    description: Mid-mile trip ID
    data_type: TEXT
  - name: mm_connectiontype
    expr: CONNECTIONTYPE
    description: Connection type (Local/Network)
    sample_values:
    - Local Connection
    - Network Connection
    data_type: TEXT
  - name: mm_connectionid
    expr: CONNECTIONID
    description: Connection ID
    data_type: TEXT
  - name: mm_depart_location
    expr: '"DEPART_LOCATION (Loading)"'
    description: Departure/loading hub
    data_type: TEXT
  - name: mm_arrival_location
    expr: '"ARRIVAL_LOCATION (UnLoading)"'
    description: Arrival/unloading hub
    data_type: TEXT
  facts:
  - name: mm_trip_order
    expr: '"TRIP ORDER"'
    description: Trip leg order in the journey
    data_type: NUMBER
  primary_key:
    columns:
    - mm_awb
- name: dim_hub_city
  description: Hub to city and territory mapping.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: DIM_HUB_CITY
  dimensions:
  - name: hub_name
    expr: '"HubName"'
    description: Hub name code
    data_type: TEXT
  - name: hub_state
    expr: '"HubState"'
    description: Hub state
    data_type: TEXT
  - name: hub_city
    expr: '"HubCity"'
    description: Hub city
    data_type: TEXT
  - name: hub_territory
    expr: '"Territory"'
    description: Hub territory
    data_type: TEXT
  primary_key:
    columns:
    - hub_name
- name: dim_hub_to_zone
  description: Hub to zone mapping.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: DIM_HUB_TO_ZONE
  dimensions:
  - name: hub_name_zone
    expr: '"hubname"'
    description: Hub name
    data_type: TEXT
  - name: hub_zone_name
    expr: '"hubzonename"'
    description: Zone name
    synonyms:
    - zone
    data_type: TEXT
  - name: center_type
    expr: '"centertype"'
    description: Center type (Hub/SVC)
    data_type: TEXT
  primary_key:
    columns:
    - hub_name_zone
- name: daily_load
  description: Trip-level linehaul load details per AWB — loading/unloading cities, connection names, LH cost per shipment.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: DAILY_LOAD
  dimensions:
  - name: dl_awb
    expr: AWB
    description: AWB number
    data_type: TEXT
  - name: dl_mm_tripid
    expr: MM_TRIPID
    description: Mid-mile trip ID
    data_type: TEXT
  - name: dl_clientname
    expr: CLIENTNAME
    description: Client name
    data_type: TEXT
  - name: dl_connectionid
    expr: '"connectionid"'
    description: Connection ID
    data_type: TEXT
  - name: dl_loading_city
    expr: '"Loading_city"'
    description: Loading city
    synonyms:
    - from city
    - origin city
    data_type: TEXT
  - name: dl_unloading_city
    expr: '"Unloading_city"'
    description: Unloading city
    synonyms:
    - to city
    - destination city
    data_type: TEXT
  - name: dl_connection_name
    expr: '"final_connection_name"'
    description: Connection/route name
    synonyms:
    - route name
    - connection
    data_type: TEXT
  - name: dl_depart_location
    expr: '"DEPART_LOCATION (Loading)"'
    description: Departure hub (loading)
    data_type: TEXT
  - name: dl_arrival_location
    expr: '"ARRIVAL_LOCATION (UnLoading)"'
    description: Arrival hub (unloading)
    data_type: TEXT
  - name: dl_originhub
    expr: ORIGINHUB
    description: Origin hub
    data_type: TEXT
  - name: dl_desthub
    expr: DESTHUB
    description: Destination hub
    data_type: TEXT
  - name: dl_stoppointhubname
    expr: STOPPOINTHUBNAME
    description: Stop point hub name
    data_type: TEXT
  time_dimensions:
  - name: dl_trip_start_date
    expr: TRY_TO_TIMESTAMP("Trip_start_date")
    description: Trip start date
    data_type: TIMESTAMP
  - name: dl_trip_close_date
    expr: TRY_TO_TIMESTAMP("Trip_close_date")
    description: Trip close date
    data_type: TIMESTAMP
  facts:
  - name: dl_tot_chrgwt
    expr: TOT_CHRGWT
    description: Billed weight per AWB on this trip
    synonyms:
    - load weight
    - trip weight
    data_type: NUMBER
  - name: dl_tot_phywt
    expr: TOT_PHYWT
    description: Physical weight per AWB
    data_type: NUMBER
  - name: dl_tot_volwt
    expr: TOT_VOLWT
    description: Volumetric weight per AWB
    data_type: NUMBER
  - name: dl_lh_cost
    expr: '"LH Cost"'
    description: Linehaul cost allocated to this AWB
    synonyms:
    - linehaul cost per awb
    data_type: NUMBER
  - name: dl_stoppointorder
    expr: '"stoppointorder"'
    description: Stop point order in trip
    data_type: NUMBER
  metrics:
  - name: dl_total_load
    expr: SUM(TOT_CHRGWT)
    description: Total load (billed weight) on trips
  - name: dl_total_lh_cost
    expr: SUM("LH Cost")
    description: Total linehaul cost across trips
  - name: dl_awb_count
    expr: COUNT(DISTINCT AWB)
    description: Unique AWBs on trips
  - name: dl_lh_cpk
    expr: SUM("LH Cost") / NULLIF(SUM(TOT_CHRGWT), 0)
    description: Linehaul cost per kg
  primary_key:
    columns:
    - dl_awb
- name: weighted_utilization
  description: Vehicle/trip-level utilization metrics — capacity, actual load, utilization %, trip cost, cost per kg.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: WEIGHTED_UTILIZATION
  dimensions:
  - name: wu_connection_name
    expr: '"Final connection name"'
    description: Connection/route name
    synonyms:
    - route
    - connection
    data_type: TEXT
  - name: wu_lane
    expr: '"Lane"'
    description: Lane (origin-destination pair)
    synonyms:
    - od pair
    - route lane
    data_type: TEXT
  - name: wu_route_type
    expr: '"Route type"'
    description: Route type (National/Regional)
    synonyms:
    - national regional
    sample_values:
    - National
    - Regional
    data_type: TEXT
  - name: wu_load_unload_city
    expr: '"load_unloadcity"'
    description: Loading/unloading city
    data_type: TEXT
  - name: wu_vehicle_name
    expr: '"vehiclename"'
    description: Vehicle type/name
    synonyms:
    - vehicle
    - truck type
    data_type: TEXT
  - name: wu_connectionid
    expr: '"connectionid"'
    description: Connection ID
    data_type: TEXT
  - name: wu_tripsheetno
    expr: '"TripSheetNo"'
    description: Trip sheet number
    data_type: TEXT
  - name: wu_vendor_name
    expr: '"Vendor_Name"'
    description: Vehicle vendor name
    data_type: TEXT
  - name: wu_dedicated_route
    expr: '"Dedicated Route as per Mapping"'
    description: Dedicated route mapping
    data_type: TEXT
  time_dimensions:
  - name: wu_start_date
    expr: TRY_TO_DATE("Start Date")
    description: Trip start date
    data_type: DATE
  - name: wu_close_date
    expr: TRY_TO_DATE("Close Date")
    description: Trip close date
    data_type: DATE
  facts:
  - name: wu_phy_wt
    expr: TRY_TO_NUMBER("Phy Wt", 18, 2)
    description: Physical weight loaded
    data_type: NUMBER
  - name: wu_vol_wt
    expr: TRY_TO_NUMBER("Vol Wt", 18, 2)
    description: Volumetric weight loaded
    data_type: NUMBER
  - name: wu_chg_wt
    expr: TRY_TO_NUMBER("Chg Wt", 18, 2)
    description: Charged weight loaded
    data_type: NUMBER
  - name: wu_phy_cap
    expr: TRY_TO_NUMBER("Phy Cap", 18, 2)
    description: Physical weight capacity
    data_type: NUMBER
  - name: wu_vol_cap
    expr: TRY_TO_NUMBER("Vol Cap", 18, 2)
    description: Volumetric weight capacity
    data_type: NUMBER
  - name: wu_trip_cost
    expr: TRY_TO_NUMBER("Trip Cost", 18, 2)
    description: Total trip cost
    synonyms:
    - vehicle cost
    data_type: NUMBER
  - name: wu_distance
    expr: TRY_TO_NUMBER("Dist.", 18, 2)
    description: Trip distance
    data_type: NUMBER
  metrics:
  - name: wu_avg_phy_utilization
    expr: AVG(TRY_TO_NUMBER(REPLACE("WU_Phy", '%', ''), 18, 2))
    description: Average physical weight utilization %
  - name: wu_avg_vol_utilization
    expr: AVG(TRY_TO_NUMBER(REPLACE("WU_Vol", '%', ''), 18, 2))
    description: Average volumetric utilization %
  - name: wu_total_trip_cost
    expr: SUM(TRY_TO_NUMBER("Trip Cost", 18, 2))
    description: Total trip cost
  - name: wu_trip_count
    expr: COUNT(DISTINCT "TripSheetNo")
    description: Number of unique trips
  - name: wu_cost_per_kg
    expr: SUM(TRY_TO_NUMBER("Trip Cost", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("Chg Wt", 18, 2)), 0)
    description: Trip cost per kg
  primary_key:
    columns:
    - wu_tripsheetno
relationships:
- name: b2b_to_awb
  left_table: b2b_revenue
  right_table: awb_file
  relationship_columns:
  - left_column: awb_no
    right_column: parentawbno
  join_type: left_outer
  relationship_type: many_to_one
- name: b2b_to_fm
  left_table: fm_journey
  right_table: b2b_revenue
  relationship_columns:
  - left_column: awb
    right_column: awb_no
  join_type: left_outer
  relationship_type: many_to_one
- name: b2b_to_lm
  left_table: lm_journey
  right_table: b2b_revenue
  relationship_columns:
  - left_column: awb
    right_column: awb_no
  join_type: left_outer
  relationship_type: many_to_one
- name: b2b_to_mm
  left_table: mm_journey
  right_table: b2b_revenue
  relationship_columns:
  - left_column: mm_awb
    right_column: awb_no
  join_type: left_outer
  relationship_type: many_to_one
verified_queries:
- name: overall_business_summary
  question: What is my overall business this month?
  sql: |
    SELECT COUNT("AWB No") AS total_shipments, COUNT(DISTINCT "Client Name") AS unique_customers, SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) AS total_cost, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS total_margin, SUM(TRY_TO_NUMBER("Margin", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("Net Charges", 18, 2)), 0) * 100 AS margin_pct, SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS total_volume_kg, SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)), 0) AS cpk, SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)), 0) AS yield_rpk FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
- name: top_5_customers
  question: Who are my top 5 customers?
  sql: |
    SELECT "Client Name", SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS total_margin, SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS total_volume_kg FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" ORDER BY total_revenue DESC LIMIT 5
- name: top_10_customers
  question: Who are my top 10 customers?
  sql: |
    SELECT "Client Name", SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS total_margin, SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS total_volume_kg FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" ORDER BY total_revenue DESC LIMIT 10
- name: top_20_customers
  question: Who are my top 20 customers?
  sql: |
    SELECT "Client Name", SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS total_margin, SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS total_volume_kg FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" ORDER BY total_revenue DESC LIMIT 20
- name: max_load_on_lane
  question: Which customer gives me maximum load on DEL-BLR lane?
  sql: |
    SELECT "Client Name", SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS total_volume_kg, SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS total_margin FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE WHERE "Origin_City" = 'DEL' AND "Dest_City" = 'BLR' GROUP BY "Client Name" ORDER BY total_volume_kg DESC LIMIT 10
- name: overall_yield
  question: What is my overall yield this month?
  sql: |
    SELECT SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)), 0) AS overall_yield_rpk, SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS total_volume_kg FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
- name: yield_top_10
  question: What is the yield of my top 10 customers?
  sql: |
    SELECT "Client Name", SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS total_volume_kg, SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)), 0) AS yield_rpk FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" ORDER BY total_revenue DESC LIMIT 10
- name: cost_driving_loss_client
  question: Which cost is driving the loss for the client?
  sql: |
    SELECT "Client Name", SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS revenue, SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) AS total_cost, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS margin, SUM(TRY_TO_NUMBER("Pickup Cost", 18, 2)) AS pickup_cost, SUM(TRY_TO_NUMBER("Delivery Cost", 18, 2)) AS delivery_cost, SUM(TRY_TO_NUMBER("Linehaul Cost", 18, 2)) AS linehaul_cost, SUM(TRY_TO_NUMBER("Midmile Cost", 18, 2)) AS midmile_cost, SUM(TRY_TO_NUMBER("Handling Cost", 18, 2)) AS handling_cost, SUM(TRY_TO_NUMBER("Common Costs", 18, 2)) AS common_costs, SUM(TRY_TO_NUMBER("Other Costs", 18, 2)) AS other_costs FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" HAVING SUM(TRY_TO_NUMBER("Margin", 18, 2)) < 0 ORDER BY margin ASC LIMIT 10
- name: cost_driving_loss_lane
  question: Which cost is driving the loss for the lane?
  sql: |
    SELECT "Origin_City" || '-' || "Dest_City" AS od_pair, SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS revenue, SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) AS total_cost, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS margin, SUM(TRY_TO_NUMBER("Pickup Cost", 18, 2)) AS pickup_cost, SUM(TRY_TO_NUMBER("Delivery Cost", 18, 2)) AS delivery_cost, SUM(TRY_TO_NUMBER("Linehaul Cost", 18, 2)) AS linehaul_cost, SUM(TRY_TO_NUMBER("Midmile Cost", 18, 2)) AS midmile_cost, SUM(TRY_TO_NUMBER("Handling Cost", 18, 2)) AS handling_cost, SUM(TRY_TO_NUMBER("Common Costs", 18, 2)) AS common_costs FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Origin_City", "Dest_City" HAVING SUM(TRY_TO_NUMBER("Margin", 18, 2)) < 0 ORDER BY margin ASC LIMIT 10
- name: national_vs_regional
  question: What is the national vs regional volume comparison?
  sql: |
    SELECT CASE WHEN "Origin_Terr" != "Dest_Terr" THEN 'National' ELSE 'Regional' END AS route_type,
      SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS total_volume,
      SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue,
      SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS total_margin,
      COUNT("AWB No") AS shipment_count
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    GROUP BY route_type
    ORDER BY total_volume DESC
- name: negative_margin_above_10l
  question: Top 10 negative margin customers with revenue more than 10 lacs?
  sql: |
    SELECT "Client Name", SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) AS total_cost, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS total_margin, SUM(TRY_TO_NUMBER("Margin", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("Net Charges", 18, 2)), 0) * 100 AS margin_pct FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" HAVING SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) > 1000000 AND SUM(TRY_TO_NUMBER("Margin", 18, 2)) < 0 ORDER BY total_margin ASC LIMIT 10
- name: top_5_negative_od
  question: What are the top 5 OD pairs with the most negative margin?
  sql: |
    SELECT "Origin_City" || '-' || "Dest_City" AS od_pair, SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS total_revenue, SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) AS total_cost, SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS total_margin FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Origin_City", "Dest_City" HAVING SUM(TRY_TO_NUMBER("Margin", 18, 2)) < 0 ORDER BY total_margin ASC LIMIT 5
- name: cost_breakdown
  question: What is the cost breakdown?
  sql: |
    SELECT SUM(TRY_TO_NUMBER("Pickup Cost", 18, 2)) AS pickup_cost, SUM(TRY_TO_NUMBER("Delivery Cost", 18, 2)) AS delivery_cost, SUM(TRY_TO_NUMBER("Linehaul Cost", 18, 2)) AS linehaul_cost, SUM(TRY_TO_NUMBER("Midmile Cost", 18, 2)) AS midmile_cost, SUM(TRY_TO_NUMBER("Handling Cost", 18, 2)) AS handling_cost, SUM(TRY_TO_NUMBER("Common Costs", 18, 2)) AS common_costs, SUM(TRY_TO_NUMBER("Other Costs", 18, 2)) AS other_costs, SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) AS total_cost FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
- name: top5_od_negative_margin_per_customer
  question: Top 5 OD pair wise lanes contributing to negative margin in top 10 negative margin customers
  sql: |
    WITH neg_customers AS (
      SELECT "Client Name"
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      GROUP BY "Client Name"
      HAVING SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) > 1000000
        AND SUM(TRY_TO_NUMBER("Margin", 18, 2)) < 0
      ORDER BY SUM(TRY_TO_NUMBER("Margin", 18, 2)) ASC
      LIMIT 10
    ),
    ranked AS (
      SELECT b."Client Name",
        b."Origin_City" || '-' || b."Dest_City" AS od_pair,
        SUM(TRY_TO_NUMBER(b."Net Charges", 18, 2)) AS revenue,
        SUM(TRY_TO_NUMBER(b."Margin", 18, 2)) AS margin,
        ROW_NUMBER() OVER (PARTITION BY b."Client Name" ORDER BY SUM(TRY_TO_NUMBER(b."Margin", 18, 2)) ASC) AS rn
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE b
      INNER JOIN neg_customers nc ON b."Client Name" = nc."Client Name"
      GROUP BY b."Client Name", b."Origin_City", b."Dest_City"
      HAVING SUM(TRY_TO_NUMBER(b."Margin", 18, 2)) < 0
    )
    SELECT "Client Name", od_pair, revenue, margin
    FROM ranked WHERE rn <= 5
    ORDER BY "Client Name", margin ASC
- name: top10_negative_margin_lanes_national
  question: Top 10 negative margin lanes in National Linehaul
  sql: |
    SELECT "Origin_City" || '-' || "Dest_City" AS od_pair,
      SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS revenue,
      SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) AS total_cost,
      SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS margin,
      SUM(TRY_TO_NUMBER("Linehaul Cost", 18, 2)) AS linehaul_cost,
      SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS volume_kg,
      SUM(TRY_TO_NUMBER("Margin", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("Net Charges", 18, 2)), 0) * 100 AS margin_pct
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "Origin_Terr" != "Dest_Terr"
    GROUP BY "Origin_City", "Dest_City"
    HAVING SUM(TRY_TO_NUMBER("Margin", 18, 2)) < 0
    ORDER BY margin ASC
    LIMIT 10
- name: top10_positive_margin_lanes_national
  question: Top 10 positive margin lanes in National Linehaul
  sql: |
    SELECT "Origin_City" || '-' || "Dest_City" AS od_pair,
      SUM(TRY_TO_NUMBER("Net Charges", 18, 2)) AS revenue,
      SUM(TRY_TO_NUMBER("Total Cost", 18, 2)) AS total_cost,
      SUM(TRY_TO_NUMBER("Margin", 18, 2)) AS margin,
      SUM(TRY_TO_NUMBER("Linehaul Cost", 18, 2)) AS linehaul_cost,
      SUM(TRY_TO_NUMBER("TOT_CHRGWT", 18, 4)) AS volume_kg,
      SUM(TRY_TO_NUMBER("Margin", 18, 2)) / NULLIF(SUM(TRY_TO_NUMBER("Net Charges", 18, 2)), 0) * 100 AS margin_pct
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "Origin_Terr" != "Dest_Terr"
    GROUP BY "Origin_City", "Dest_City"
    HAVING SUM(TRY_TO_NUMBER("Margin", 18, 2)) > 0
    ORDER BY margin DESC
    LIMIT 10
module_custom_instructions:
  sql_generation: 'Revenue = Net Charges column. Margin = pre-calculated Margin column. Margin% = SUM(Margin)/NULLIF(SUM(Net Charges),0)*100. CPK = SUM(Total Cost)/NULLIF(SUM(TOT_CHRGWT),0). Yield/RPK = SUM(Net Charges)/NULLIF(SUM(TOT_CHRGWT),0). Volume = TOT_CHRGWT (billed weight kg). National vs Regional: National means Origin_Terr != Dest_Terr (cross-territory). Regional means Origin_Terr = Dest_Terr (same territory). Do NOT use Route column for national/regional — it only has Surface. Top N: include revenue, margin, volume. 10 lakhs = 1000000. All numeric columns are VARCHAR, always use TRY_TO_NUMBER() for aggregations. Cost RCA: break Total Cost into Pickup, Delivery, Linehaul, Midmile, Handling, Common, Other costs.'
