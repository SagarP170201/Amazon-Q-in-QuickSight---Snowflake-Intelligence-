module_custom_instructions:
  sql_generation: |-
    Revenue = Net Charges column. Margin = pre-calculated Margin column. Margin% = SUM(Margin)/NULLIF(SUM(Net Charges),0)*100. CPK = SUM(Total Cost)/NULLIF(SUM(TOT_CHRGWT),0). Yield/RPK = SUM(Net Charges)/NULLIF(SUM(TOT_CHRGWT),0). Volume = TOT_CHRGWT (billed weight kg). National vs Regional: National means Origin_Terr != Dest_Terr (cross-territory). Regional means Origin_Terr = Dest_Terr (same territory). Do NOT use Route column for national/regional — it only has Surface. Top N: include revenue, margin, volume. 10 lakhs = 1000000. Numeric columns (Net Charges, Total Cost, Margin, TOT_CHRGWT, and all cost columns) are native numeric types - use them directly in aggregations. Do NOT wrap them in TRY_TO_NUMBER(). Cost RCA: break Total Cost into Pickup, Delivery, Linehaul, Midmile, Handling, Common, Other costs. Time-based analysis (this month, last month, last N months, quarter, YTD, trends, MoM, YoY) MUST use the "InScan Date" column as the business/transaction date. Do NOT use PICKUPDATE for time filtering or grouping. Yield (RPK) is always revenue per unit volume = SUM(Net Charges)/NULLIF(SUM(TOT_CHRGWT),0); never express yield as a percentage of revenue.
verified_queries:
- name: OVERALL_BUSINESS_SUMMARY
  sql: |
    SELECT COUNT("AWB No") AS total_shipments, COUNT(DISTINCT "Client Name") AS unique_customers, SUM("Net Charges") AS total_revenue, SUM("Total Cost") AS total_cost, SUM("Margin") AS total_margin, SUM("Margin") / NULLIF(SUM("Net Charges"), 0) * 100 AS margin_pct, SUM("TOT_CHRGWT") AS total_volume_kg, SUM("Total Cost") / NULLIF(SUM("TOT_CHRGWT"), 0) AS cpk, SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS yield_rpk FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
  question: What is my overall business this month?
  use_as_onboarding_question: false
- name: TOP_5_CUSTOMERS
  sql: |
    SELECT "Client Name", SUM("Net Charges") AS total_revenue, SUM("Margin") AS total_margin, SUM("TOT_CHRGWT") AS total_volume_kg FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" ORDER BY total_revenue DESC LIMIT 5
  question: Who are my top 5 customers?
  use_as_onboarding_question: false
- name: TOP_10_CUSTOMERS
  sql: |
    SELECT "Client Name", SUM("Net Charges") AS total_revenue, SUM("Margin") AS total_margin, SUM("TOT_CHRGWT") AS total_volume_kg FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" ORDER BY total_revenue DESC LIMIT 10
  question: Who are my top 10 customers?
  use_as_onboarding_question: false
- name: TOP_20_CUSTOMERS
  sql: |
    SELECT "Client Name", SUM("Net Charges") AS total_revenue, SUM("Margin") AS total_margin, SUM("TOT_CHRGWT") AS total_volume_kg FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" ORDER BY total_revenue DESC LIMIT 20
  question: Who are my top 20 customers?
  use_as_onboarding_question: false
- name: MAX_LOAD_ON_LANE
  sql: |
    SELECT "Client Name", SUM("TOT_CHRGWT") AS total_volume_kg, SUM("Net Charges") AS total_revenue, SUM("Margin") AS total_margin FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE WHERE UPPER("Origin_City") LIKE '%DELHI%' AND UPPER("Dest_City") = 'BANGALORE' GROUP BY "Client Name" ORDER BY total_volume_kg DESC LIMIT 10
  question: Which customer gives me maximum load on DEL-BLR lane?
  use_as_onboarding_question: false
- name: OVERALL_YIELD
  sql: |
    SELECT SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS overall_yield_rpk, SUM("Net Charges") AS total_revenue, SUM("TOT_CHRGWT") AS total_volume_kg FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
  question: What is my overall yield this month?
  use_as_onboarding_question: false
- name: YIELD_TOP_10
  sql: |
    SELECT "Client Name", SUM("Net Charges") AS total_revenue, SUM("TOT_CHRGWT") AS total_volume_kg, SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS yield_rpk FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" ORDER BY total_revenue DESC LIMIT 10
  question: What is the yield of my top 10 customers?
  use_as_onboarding_question: false
- name: COST_DRIVING_LOSS_CLIENT
  sql: |
    SELECT "Client Name", SUM("Net Charges") AS revenue, SUM("Total Cost") AS total_cost, SUM("Margin") AS margin, SUM("Pickup Cost") AS pickup_cost, SUM("Delivery Cost") AS delivery_cost, SUM("Linehaul Cost") AS linehaul_cost, SUM("Midmile Cost") AS midmile_cost, SUM("Handling Cost") AS handling_cost, SUM("Common Costs") AS common_costs, SUM("Other Costs") AS other_costs FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" HAVING SUM("Margin") < 0 ORDER BY margin ASC LIMIT 10
  question: Which cost is driving the loss for the client?
  use_as_onboarding_question: false
- name: COST_DRIVING_LOSS_LANE
  sql: |
    SELECT "Origin_City" || '-' || "Dest_City" AS od_pair, SUM("Net Charges") AS revenue, SUM("Total Cost") AS total_cost, SUM("Margin") AS margin, SUM("Pickup Cost") AS pickup_cost, SUM("Delivery Cost") AS delivery_cost, SUM("Linehaul Cost") AS linehaul_cost, SUM("Midmile Cost") AS midmile_cost, SUM("Handling Cost") AS handling_cost, SUM("Common Costs") AS common_costs FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Origin_City", "Dest_City" HAVING SUM("Margin") < 0 ORDER BY margin ASC LIMIT 10
  question: Which cost is driving the loss for the lane?
  use_as_onboarding_question: false
- name: NATIONAL_VS_REGIONAL
  sql: |
    SELECT CASE WHEN "Origin_Terr" != "Dest_Terr" THEN 'National' ELSE 'Regional' END AS route_type,
      SUM("TOT_CHRGWT") AS total_volume,
      SUM("Net Charges") AS total_revenue,
      SUM("Margin") AS total_margin,
      COUNT("AWB No") AS shipment_count
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    GROUP BY route_type
    ORDER BY total_volume DESC
  question: What is the national vs regional volume comparison?
  use_as_onboarding_question: false
- name: NEGATIVE_MARGIN_ABOVE_10L
  sql: |
    SELECT "Client Name", SUM("Net Charges") AS total_revenue, SUM("Total Cost") AS total_cost, SUM("Margin") AS total_margin, SUM("Margin") / NULLIF(SUM("Net Charges"), 0) * 100 AS margin_pct FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Client Name" HAVING SUM("Net Charges") > 1000000 AND SUM("Margin") < 0 ORDER BY total_margin ASC LIMIT 10
  question: Top 10 negative margin customers with revenue more than 10 lacs?
  use_as_onboarding_question: false
- name: TOP_5_NEGATIVE_OD
  sql: |
    SELECT "Origin_City" || '-' || "Dest_City" AS od_pair, SUM("Net Charges") AS total_revenue, SUM("Total Cost") AS total_cost, SUM("Margin") AS total_margin FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE GROUP BY "Origin_City", "Dest_City" HAVING SUM("Margin") < 0 ORDER BY total_margin ASC LIMIT 5
  question: What are the top 5 OD pairs with the most negative margin?
  use_as_onboarding_question: false
- name: COST_BREAKDOWN
  sql: |
    SELECT SUM("Pickup Cost") AS pickup_cost, SUM("Delivery Cost") AS delivery_cost, SUM("Linehaul Cost") AS linehaul_cost, SUM("Midmile Cost") AS midmile_cost, SUM("Handling Cost") AS handling_cost, SUM("Common Costs") AS common_costs, SUM("Other Costs") AS other_costs, SUM("Total Cost") AS total_cost FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
  question: What is the cost breakdown?
  use_as_onboarding_question: false
- name: TOP5_OD_NEGATIVE_MARGIN_PER_CUSTOMER
  sql: |
    WITH neg_customers AS (
      SELECT "Client Name"
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      GROUP BY "Client Name"
      HAVING SUM("Net Charges") > 1000000
        AND SUM("Margin") < 0
      ORDER BY SUM("Margin") ASC
      LIMIT 10
    ),
    ranked AS (
      SELECT b."Client Name",
        b."Origin_City" || '-' || b."Dest_City" AS od_pair,
        SUM(b."Net Charges") AS revenue,
        SUM(b."Margin") AS margin,
        ROW_NUMBER() OVER (PARTITION BY b."Client Name" ORDER BY SUM(b."Margin") ASC) AS rn
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE b
      INNER JOIN neg_customers nc ON b."Client Name" = nc."Client Name"
      GROUP BY b."Client Name", b."Origin_City", b."Dest_City"
      HAVING SUM(b."Margin") < 0
    )
    SELECT "Client Name", od_pair, revenue, margin
    FROM ranked WHERE rn <= 5
    ORDER BY "Client Name", margin ASC
  question: Top 5 OD pair wise lanes contributing to negative margin in top 10 negative margin customers
  use_as_onboarding_question: false
- name: TOP10_NEGATIVE_MARGIN_LANES_NATIONAL
  sql: |
    SELECT "Origin_City" || '-' || "Dest_City" AS od_pair,
      SUM("Net Charges") AS revenue,
      SUM("Total Cost") AS total_cost,
      SUM("Margin") AS margin,
      SUM("Linehaul Cost") AS linehaul_cost,
      SUM("TOT_CHRGWT") AS volume_kg,
      SUM("Margin") / NULLIF(SUM("Net Charges"), 0) * 100 AS margin_pct
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "Origin_Terr" != "Dest_Terr"
    GROUP BY "Origin_City", "Dest_City"
    HAVING SUM("Margin") < 0
    ORDER BY margin ASC
    LIMIT 10
  question: Top 10 negative margin lanes in National Linehaul
  use_as_onboarding_question: false
- name: TOP10_POSITIVE_MARGIN_LANES_NATIONAL
  sql: |
    SELECT "Origin_City" || '-' || "Dest_City" AS od_pair,
      SUM("Net Charges") AS revenue,
      SUM("Total Cost") AS total_cost,
      SUM("Margin") AS margin,
      SUM("Linehaul Cost") AS linehaul_cost,
      SUM("TOT_CHRGWT") AS volume_kg,
      SUM("Margin") / NULLIF(SUM("Net Charges"), 0) * 100 AS margin_pct
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "Origin_Terr" != "Dest_Terr"
    GROUP BY "Origin_City", "Dest_City"
    HAVING SUM("Margin") > 0
    ORDER BY margin DESC
    LIMIT 10
  question: Top 10 positive margin lanes in National Linehaul
  use_as_onboarding_question: false
- name: BUSINESS_LAST_MONTH
  sql: |
    SELECT COUNT("AWB No") AS total_shipments, COUNT(DISTINCT "Client Name") AS unique_customers,
      SUM("Net Charges") AS total_revenue,
      SUM("Total Cost") AS total_cost,
      SUM("Margin") AS total_margin,
      SUM("Margin") / NULLIF(SUM("Net Charges"), 0) * 100 AS margin_pct,
      SUM("TOT_CHRGWT") AS total_volume_kg
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
  question: What was my business last month?
  use_as_onboarding_question: false
- name: BUSINESS_LAST_3_MONTHS
  sql: |
    SELECT DATE_TRUNC('month', "InScan Date") AS month,
      COUNT("AWB No") AS shipments, COUNT(DISTINCT "Client Name") AS customers,
      SUM("Net Charges") AS revenue,
      SUM("Margin") AS margin,
      SUM("TOT_CHRGWT") AS volume_kg
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "InScan Date" >= DATEADD('month', -3, CURRENT_DATE())
    GROUP BY month ORDER BY month
  question: What was my business in the last 3 months?
  use_as_onboarding_question: false
- name: BUSINESS_THIS_QUARTER
  sql: |
    SELECT COUNT("AWB No") AS total_shipments, COUNT(DISTINCT "Client Name") AS unique_customers,
      SUM("Net Charges") AS total_revenue,
      SUM("Margin") AS total_margin,
      SUM("TOT_CHRGWT") AS total_volume_kg
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE DATE_TRUNC('quarter', "InScan Date") = DATE_TRUNC('quarter', CURRENT_DATE())
  question: What was my business this quarter?
  use_as_onboarding_question: false
- name: BUSINESS_YTD
  sql: |
    SELECT COUNT("AWB No") AS total_shipments, COUNT(DISTINCT "Client Name") AS unique_customers,
      SUM("Net Charges") AS total_revenue,
      SUM("Margin") AS total_margin,
      SUM("TOT_CHRGWT") AS total_volume_kg
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE YEAR("InScan Date") = YEAR(CURRENT_DATE())
  question: What is my YTD business?
  use_as_onboarding_question: false
- name: TOP20_UPTRADING_CUSTOMERS
  sql: |
    WITH this_month AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    last_month AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
      GROUP BY "Client Name"
    )
    SELECT t."Client Name", t.revenue AS current_revenue, l.revenue AS prev_revenue,
      t.revenue - COALESCE(l.revenue, 0) AS revenue_change,
      (t.revenue - COALESCE(l.revenue, 0)) / NULLIF(l.revenue, 0) * 100 AS pct_change
    FROM this_month t LEFT JOIN last_month l ON t."Client Name" = l."Client Name"
    WHERE t.revenue > COALESCE(l.revenue, 0)
    ORDER BY revenue_change DESC LIMIT 20
  question: Top 20 uptrading customers by revenue this month vs last month
  use_as_onboarding_question: false
- name: TOP20_DOWNTRADING_CUSTOMERS
  sql: |
    WITH this_month AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    last_month AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
      GROUP BY "Client Name"
    )
    SELECT l."Client Name", COALESCE(t.revenue, 0) AS current_revenue, l.revenue AS prev_revenue,
      COALESCE(t.revenue, 0) - l.revenue AS revenue_change,
      (COALESCE(t.revenue, 0) - l.revenue) / NULLIF(l.revenue, 0) * 100 AS pct_change
    FROM last_month l LEFT JOIN this_month t ON l."Client Name" = t."Client Name"
    WHERE COALESCE(t.revenue, 0) < l.revenue
    ORDER BY revenue_change ASC LIMIT 20
  question: Top 20 downtrading customers by revenue this month vs last month
  use_as_onboarding_question: false
- name: NEW_CUSTOMERS_THIS_MONTH
  sql: |
    WITH current_customers AS (
      SELECT DISTINCT "Client Name"
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', CURRENT_DATE())
    ),
    prev_customers AS (
      SELECT DISTINCT "Client Name"
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "InScan Date" < DATE_TRUNC('month', CURRENT_DATE())
    )
    SELECT c."Client Name", SUM(b."Net Charges") AS revenue
    FROM current_customers c
    LEFT JOIN prev_customers p ON c."Client Name" = p."Client Name"
    JOIN XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE b ON c."Client Name" = b."Client Name"
      AND DATE_TRUNC('month', b."InScan Date") = DATE_TRUNC('month', CURRENT_DATE())
    WHERE p."Client Name" IS NULL
    GROUP BY c."Client Name" ORDER BY revenue DESC
  question: How many new customers have been added this month?
  use_as_onboarding_question: false
- name: YIELD_DROPPED_MOM
  sql: |
    WITH this_month AS (
      SELECT "Client Name",
        SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS yield
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name" HAVING SUM("Net Charges") > 1000000
    ),
    last_month AS (
      SELECT "Client Name",
        SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS yield
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
      GROUP BY "Client Name" HAVING SUM("Net Charges") > 1000000
    )
    SELECT t."Client Name", t.yield AS current_yield, l.yield AS prev_yield,
      t.yield - l.yield AS yield_change,
      (t.yield - l.yield) / NULLIF(l.yield, 0) * 100 AS pct_change
    FROM this_month t JOIN last_month l ON t."Client Name" = l."Client Name"
    WHERE t.yield < l.yield
    ORDER BY yield_change ASC LIMIT 10
  question: Which customers yield dropped this month vs last month?
  use_as_onboarding_question: false
- name: REVENUE_TREND_MONTHLY
  sql: |
    SELECT DATE_TRUNC('month', "InScan Date") AS month,
      SUM("Net Charges") AS revenue,
      SUM("TOT_CHRGWT") AS volume_kg,
      SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS yield_rpk,
      SUM("Total Cost") / NULLIF(SUM("TOT_CHRGWT"), 0) AS cpk
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    GROUP BY month ORDER BY month
  question: Revenue, RPK, Yield, Volume trend by month
  use_as_onboarding_question: false
- name: NATIONAL_VS_REGIONAL_TREND
  sql: |
    SELECT DATE_TRUNC('month', "InScan Date") AS month,
      CASE WHEN "Origin_Terr" != "Dest_Terr" THEN 'National' ELSE 'Regional' END AS route_type,
      SUM("Net Charges") AS revenue,
      SUM("TOT_CHRGWT") AS volume_kg,
      SUM("Margin") AS margin
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    GROUP BY month, route_type ORDER BY month, route_type
  question: Trend of National vs Regional business by month
  use_as_onboarding_question: false
- name: YOY_GROWTH_TOP_CLIENTS
  sql: |
    WITH this_year AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE YEAR("InScan Date") = YEAR(CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    last_year AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE YEAR("InScan Date") = YEAR(CURRENT_DATE()) - 1
      GROUP BY "Client Name"
    )
    SELECT t."Client Name", t.revenue AS current_year, l.revenue AS last_year,
      (t.revenue - COALESCE(l.revenue, 0)) / NULLIF(l.revenue, 0) * 100 AS yoy_growth_pct
    FROM this_year t LEFT JOIN last_year l ON t."Client Name" = l."Client Name"
    ORDER BY t.revenue DESC LIMIT 20
  question: YoY growth for top clients
  use_as_onboarding_question: false
- name: NEGATIVE_TO_POSITIVE_MARGIN
  sql: |
    WITH this_month AS (
      SELECT "Client Name", SUM("Margin") AS margin
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    last_month AS (
      SELECT "Client Name", SUM("Margin") AS margin
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
      GROUP BY "Client Name"
    )
    SELECT t."Client Name", l.margin AS prev_margin, t.margin AS current_margin,
      t.margin - l.margin AS margin_improvement
    FROM this_month t JOIN last_month l ON t."Client Name" = l."Client Name"
    WHERE l.margin < 0 AND t.margin > 0
    ORDER BY margin_improvement DESC
  question: Customers who went from negative margin to positive margin
  use_as_onboarding_question: false
- name: POSITIVE_TO_NEGATIVE_MARGIN
  sql: |
    WITH this_month AS (
      SELECT "Client Name", SUM("Margin") AS margin
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    last_month AS (
      SELECT "Client Name", SUM("Margin") AS margin
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
      GROUP BY "Client Name"
    )
    SELECT t."Client Name", l.margin AS prev_margin, t.margin AS current_margin,
      t.margin - l.margin AS margin_decline
    FROM this_month t JOIN last_month l ON t."Client Name" = l."Client Name"
    WHERE l.margin > 0 AND t.margin < 0
    ORDER BY margin_decline ASC
  question: Customers who went from positive margin to negative margin
  use_as_onboarding_question: false
- name: TOP10_YIELD_DROPPED_VS_6MONTHS_AGO
  sql: |
    WITH curr_month AS (
      SELECT "Client Name",
        SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS yield
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name" HAVING SUM("Net Charges") > 1000000
    ),
    six_months_ago AS (
      SELECT "Client Name",
        SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS yield
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "InScan Date") = DATE_TRUNC('month', DATEADD('month', -6, CURRENT_DATE()))
      GROUP BY "Client Name" HAVING SUM("Net Charges") > 1000000
    )
    SELECT c."Client Name", c.yield AS current_yield, s.yield AS prev_yield,
      c.yield - s.yield AS yield_change,
      (c.yield - s.yield) / NULLIF(s.yield, 0) * 100 AS pct_change
    FROM curr_month c JOIN six_months_ago s ON c."Client Name" = s."Client Name"
    WHERE c.yield < s.yield
    ORDER BY yield_change ASC LIMIT 10
  question: Top 10 customers whose yield dropped vs 6 months ago
  use_as_onboarding_question: false
- name: NATIONAL_REGIONAL_TREND_TOP10
  sql: |
    WITH top10 AS (
      SELECT "Client Name"
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      GROUP BY "Client Name" ORDER BY SUM("Net Charges") DESC LIMIT 10
    )
    SELECT DATE_TRUNC('month', b."InScan Date") AS month,
      b."Client Name",
      CASE WHEN b."Origin_Terr" != b."Dest_Terr" THEN 'National' ELSE 'Regional' END AS route_type,
      SUM(b."Net Charges") AS revenue,
      SUM(b."TOT_CHRGWT") AS volume_kg
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE b
    JOIN top10 t ON b."Client Name" = t."Client Name"
    GROUP BY month, b."Client Name", route_type
    ORDER BY month, b."Client Name", route_type
  question: Trend of National vs Regional for top 10 customers by month
  use_as_onboarding_question: false
- name: UPTRADING_LAST_7_DAYS
  sql: |
    WITH last_7 AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "InScan Date" >= DATEADD('day', -7, CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    prev_7 AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "InScan Date" >= DATEADD('day', -14, CURRENT_DATE())
        AND "InScan Date" < DATEADD('day', -7, CURRENT_DATE())
      GROUP BY "Client Name"
    )
    SELECT l."Client Name", l.revenue AS last_7d_revenue, p.revenue AS prev_7d_revenue,
      l.revenue - COALESCE(p.revenue, 0) AS change,
      CASE WHEN l.revenue > COALESCE(p.revenue, 0) THEN 'Uptrading' ELSE 'Downtrading' END AS status
    FROM last_7 l LEFT JOIN prev_7 p ON l."Client Name" = p."Client Name"
    ORDER BY change DESC LIMIT 20
  question: What is the uptrading status in the last 7 days?
  use_as_onboarding_question: false
- name: DOWNTRADING_LAST_7_DAYS
  sql: |
    WITH last_7 AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "InScan Date" >= DATEADD('day', -7, CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    prev_7 AS (
      SELECT "Client Name", SUM("Net Charges") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "InScan Date" >= DATEADD('day', -14, CURRENT_DATE())
        AND "InScan Date" < DATEADD('day', -7, CURRENT_DATE())
      GROUP BY "Client Name"
    )
    SELECT p."Client Name", COALESCE(l.revenue, 0) AS last_7d_revenue, p.revenue AS prev_7d_revenue,
      COALESCE(l.revenue, 0) - p.revenue AS change
    FROM prev_7 p LEFT JOIN last_7 l ON p."Client Name" = l."Client Name"
    WHERE COALESCE(l.revenue, 0) < p.revenue
    ORDER BY change ASC LIMIT 20
  question: What is the downtrading status in the last 7 days?
  use_as_onboarding_question: false
- name: MARGIN_IMPROVEMENT_RCA
  sql: |
    SELECT "Client Name",
      SUM("Net Charges") AS revenue,
      SUM("Total Cost") AS total_cost,
      SUM("Margin") AS margin,
      SUM("Pickup Cost") AS pickup_cost,
      SUM("Delivery Cost") AS delivery_cost,
      SUM("Linehaul Cost") AS linehaul_cost,
      SUM("Midmile Cost") AS midmile_cost,
      SUM("Handling Cost") AS handling_cost,
      SUM("Common Costs") AS common_costs,
      SUM("Other Costs") AS other_costs,
      SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0) AS yield_rpk,
      SUM("Total Cost") / NULLIF(SUM("TOT_CHRGWT"), 0) AS cpk
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "Client Name" = '<CLIENT_NAME>'
    GROUP BY "Client Name"
  question: How can I improve margin for a customer?
  use_as_onboarding_question: false
- name: MARGIN_TREND_BY_CUSTOMER
  sql: |
    SELECT DATE_TRUNC('month', "InScan Date") AS month,
      SUM("Net Charges") AS revenue,
      SUM("Margin") AS margin,
      SUM("Margin") / NULLIF(SUM("Net Charges"), 0) * 100 AS margin_pct,
      SUM("TOT_CHRGWT") AS volume_kg
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "Client Name" = '<CLIENT_NAME>'
    GROUP BY month ORDER BY month
  question: What is the margin trend for a customer by month?
  use_as_onboarding_question: false
