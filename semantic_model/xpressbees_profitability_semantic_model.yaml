- name: negative_to_positive_margin
  question: Customers who went from negative margin to positive margin
  sql: |
    WITH this_month AS (
      SELECT "Client Name", SUM("\1") AS margin
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "PICKUPDATE") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    last_month AS (
      SELECT "Client Name", SUM("\1") AS margin
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "PICKUPDATE") = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
      GROUP BY "Client Name"
    )
    SELECT t."Client Name", l.margin AS prev_margin, t.margin AS current_margin,
      t.margin - l.margin AS margin_improvement
    FROM this_month t JOIN last_month l ON t."Client Name" = l."Client Name"
    WHERE l.margin < 0 AND t.margin > 0
    ORDER BY margin_improvement DESC
- name: positive_to_negative_margin
  question: Customers who went from positive margin to negative margin
  sql: |
    WITH this_month AS (
      SELECT "Client Name", SUM("\1") AS margin
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "PICKUPDATE") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    last_month AS (
      SELECT "Client Name", SUM("\1") AS margin
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "PICKUPDATE") = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
      GROUP BY "Client Name"
    )
    SELECT t."Client Name", l.margin AS prev_margin, t.margin AS current_margin,
      t.margin - l.margin AS margin_decline
    FROM this_month t JOIN last_month l ON t."Client Name" = l."Client Name"
    WHERE l.margin > 0 AND t.margin < 0
    ORDER BY margin_decline ASC
- name: top10_yield_dropped_vs_6months_ago
  question: Top 10 customers whose yield dropped vs 6 months ago
  sql: |
    WITH curr_month AS (
      SELECT "Client Name",
        SUM("\1") / NULLIF(SUM("\1"), 0) AS yield
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "PICKUPDATE") = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY "Client Name" HAVING SUM("\1") > 1000000
    ),
    six_months_ago AS (
      SELECT "Client Name",
        SUM("\1") / NULLIF(SUM("\1"), 0) AS yield
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE DATE_TRUNC('month', "PICKUPDATE") = DATE_TRUNC('month', DATEADD('month', -6, CURRENT_DATE()))
      GROUP BY "Client Name" HAVING SUM("\1") > 1000000
    )
    SELECT c."Client Name", c.yield AS current_yield, s.yield AS prev_yield,
      c.yield - s.yield AS yield_change,
      (c.yield - s.yield) / NULLIF(s.yield, 0) * 100 AS pct_change
    FROM curr_month c JOIN six_months_ago s ON c."Client Name" = s."Client Name"
    WHERE c.yield < s.yield
    ORDER BY yield_change ASC LIMIT 10
- name: national_regional_trend_top10
  question: Trend of National vs Regional for top 10 customers by month
  sql: |
    WITH top10 AS (
      SELECT "Client Name"
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      GROUP BY "Client Name" ORDER BY SUM("\1") DESC LIMIT 10
    )
    SELECT DATE_TRUNC('month', b."PICKUPDATE") AS month,
      b."Client Name",
      CASE WHEN b."Origin_Terr" != b."Dest_Terr" THEN 'National' ELSE 'Regional' END AS route_type,
      SUM(b."\1") AS revenue,
      SUM(b."\1") AS volume_kg
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE b
    JOIN top10 t ON b."Client Name" = t."Client Name"
    GROUP BY month, b."Client Name", route_type
    ORDER BY month, b."Client Name", route_type
- name: uptrading_last_7_days
  question: What is the uptrading status in the last 7 days?
  sql: |
    WITH last_7 AS (
      SELECT "Client Name", SUM("\1") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "PICKUPDATE" >= DATEADD('day', -7, CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    prev_7 AS (
      SELECT "Client Name", SUM("\1") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "PICKUPDATE" >= DATEADD('day', -14, CURRENT_DATE())
        AND "PICKUPDATE" < DATEADD('day', -7, CURRENT_DATE())
      GROUP BY "Client Name"
    )
    SELECT l."Client Name", l.revenue AS last_7d_revenue, p.revenue AS prev_7d_revenue,
      l.revenue - COALESCE(p.revenue, 0) AS change,
      CASE WHEN l.revenue > COALESCE(p.revenue, 0) THEN 'Uptrading' ELSE 'Downtrading' END AS status
    FROM last_7 l LEFT JOIN prev_7 p ON l."Client Name" = p."Client Name"
    ORDER BY change DESC LIMIT 20
- name: downtrading_last_7_days
  question: What is the downtrading status in the last 7 days?
  sql: |
    WITH last_7 AS (
      SELECT "Client Name", SUM("\1") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "PICKUPDATE" >= DATEADD('day', -7, CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    prev_7 AS (
      SELECT "Client Name", SUM("\1") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE "PICKUPDATE" >= DATEADD('day', -14, CURRENT_DATE())
        AND "PICKUPDATE" < DATEADD('day', -7, CURRENT_DATE())
      GROUP BY "Client Name"
    )
    SELECT p."Client Name", COALESCE(l.revenue, 0) AS last_7d_revenue, p.revenue AS prev_7d_revenue,
      COALESCE(l.revenue, 0) - p.revenue AS change
    FROM prev_7 p LEFT JOIN last_7 l ON p."Client Name" = l."Client Name"
    WHERE COALESCE(l.revenue, 0) < p.revenue
    ORDER BY change ASC LIMIT 20
- name: margin_improvement_rca
  question: How can I improve margin for a customer?
  sql: |
    SELECT "Client Name",
      SUM("\1") AS revenue,
      SUM("\1") AS total_cost,
      SUM("\1") AS margin,
      SUM("\1") AS pickup_cost,
      SUM("\1") AS delivery_cost,
      SUM("\1") AS linehaul_cost,
      SUM("\1") AS midmile_cost,
      SUM("\1") AS handling_cost,
      SUM("\1") AS common_costs,
      SUM("\1") AS other_costs,
      SUM("\1") / NULLIF(SUM("\1"), 0) AS yield_rpk,
      SUM("\1") / NULLIF(SUM("\1"), 0) AS cpk
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "Client Name" = '<CLIENT_NAME>'
