name: XPRESSBEES_PROFITABILITY
description: XpressBees B2B logistics profitability analysis covering revenue, cost, margin, yield, CPK, and volume metrics.
tables:
- name: AWB_FILE
  description: AWB to Promised Delivery Date mapping.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: AWB_FILE
  primary_key:
    columns:
    - PARENTAWBNO
  dimensions:
  - name: PARENTAWBNO
    description: Parent AWB number
    expr: |-
      "parentawbno"
    data_type: VARCHAR(16777216)
  time_dimensions:
  - name: PDD
    description: Promised delivery date
    expr: |-
      "pdd"
    data_type: TIMESTAMP_NTZ(9)
- name: B2B_REVENUE
  description: Primary fact table with AWB-level revenue, cost breakdowns, margin, weights, and geography.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: B2B_REVENUE
  primary_key:
    columns:
    - AWB_NO
  dimensions:
  - name: AWB_NO
    synonyms:
    - awb
    - shipment number
    - waybill
    - waybill number
    - docket
    description: Air Waybill number - unique shipment identifier
    expr: |-
      "AWB No"
    data_type: VARCHAR(16777216)
  - name: CLIENT_GROUP
    synonyms:
    - customer group
    description: Client group or parent company
    expr: |-
      "Client Group"
    data_type: VARCHAR(16777216)
  - name: CLIENT_ID
    synonyms:
    - customer id
    description: Unique client identifier
    expr: |-
      "Client ID"
    data_type: FLOAT
  - name: CLIENT_NAME
    synonyms:
    - customer name
    - customer
    - client
    description: Name of the client or customer
    expr: |-
      "Client Name"
    data_type: VARCHAR(16777216)
  - name: DENSITY_BUCKET
    description: Shipment density bucket
    expr: |-
      "Density Bucket"
    data_type: VARCHAR(16777216)
  - name: DESTINATION_HUB_NAME
    description: Destination hub name
    expr: |-
      "Destination HubName"
    data_type: VARCHAR(16777216)
  - name: DEST_CITY
    synonyms:
    - destination
    - destination city
    - to city
    description: City of shipment destination
    expr: |-
      "Dest_City"
    data_type: VARCHAR(16777216)
  - name: DEST_TERRITORY
    description: Territory of destination city
    expr: |-
      "Dest_Terr"
    data_type: VARCHAR(16777216)
  - name: NATIONAL_REGIONAL
    synonyms:
    - national
    - regional
    - national vs regional
    - route type
    description: National (cross-territory) vs Regional (same territory) classification
    expr: |-
      CASE WHEN "Origin_Terr" != "Dest_Terr" THEN 'National' ELSE 'Regional' END
    data_type: VARCHAR(8)
    sample_values:
    - National
    - Regional
  - name: ORIGIN_CITY
    synonyms:
    - origin
    - source city
    - from city
    description: City of shipment origin
    expr: |-
      "Origin_City"
    data_type: VARCHAR(16777216)
  - name: ORIGIN_HUB_NAME
    description: Origin hub name
    expr: |-
      "Origin HubName"
    data_type: VARCHAR(16777216)
  - name: ORIGIN_TERRITORY
    description: Territory of origin city
    expr: |-
      "Origin_Terr"
    data_type: VARCHAR(16777216)
  - name: REVENUE_TYPE
    description: Billing classification
    expr: |-
      "Revenue Type"
    data_type: VARIANT
  - name: ROUTE
    synonyms:
    - route type
    - national regional
    description: Shipment route classification
    expr: |-
      "Route"
    data_type: VARCHAR(16777216)
    sample_values:
    - National
    - Regional
  - name: TERRITORY
    synonyms:
    - terr
    description: Primary territory assignment
    expr: |-
      "Territory"
    data_type: VARCHAR(16777216)
  - name: TSM_NAME
    synonyms:
    - tsm
    description: Territory Sales Manager name
    expr: |-
      "TSM.Name"
    data_type: VARCHAR(16777216)
  - name: ZONE
    synonyms:
    - region
    description: Zone assignment
    expr: |-
      "Zone"
    data_type: VARCHAR(16777216)
  - name: ZSM_NAME
    synonyms:
    - zsm
    description: Zonal Sales Manager name
    expr: |-
      "ZSM.Name"
    data_type: VARCHAR(16777216)
  facts:
  - name: COMMON_COSTS
    description: Common overhead costs
    expr: |-
      "Common Costs"
    data_type: FLOAT
    access_modifier: public_access
  - name: CREDIT_NOTES
    description: Credit note value
    expr: |-
      "Credit Notes"
    data_type: FLOAT
    access_modifier: public_access
  - name: DELIVERY_COST
    description: Total delivery cost
    expr: |-
      "Delivery Cost"
    data_type: FLOAT
    access_modifier: public_access
  - name: DEMURRAGE_CHARGES
    description: Demurrage penalty charges
    expr: |-
      "Demurrage Charges"
    data_type: FLOAT
    access_modifier: public_access
  - name: DENSITY
    description: Shipment density
    expr: |-
      "Density"
    data_type: FLOAT
    access_modifier: public_access
  - name: FEEDER_COST
    description: Feeder cost to linehaul hub
    expr: |-
      "Feeder Cost - From Pickup branch / Hub till LH Hub"
    data_type: FLOAT
    access_modifier: public_access
  - name: FM_HANDLING
    description: First mile handling cost
    expr: |-
      "FM handling"
    data_type: FLOAT
    access_modifier: public_access
  - name: FREIGHT
    description: Base freight charges
    expr: CAST(NULL AS NUMBER(18,2))
    data_type: NUMBER(18,2)
    access_modifier: public_access
  - name: HANDLING_COST
    description: Total handling cost
    expr: |-
      "Handling Cost"
    data_type: FLOAT
    access_modifier: public_access
  - name: LINEHAUL_COST
    synonyms:
    - lh cost
    description: Linehaul transportation cost
    expr: |-
      "Linehaul Cost"
    data_type: FLOAT
    access_modifier: public_access
  - name: LM_HANDLING
    description: Last mile handling cost
    expr: |-
      "LM Handling"
    data_type: FLOAT
    access_modifier: public_access
  - name: MARGIN_VALUE
    synonyms:
    - margin
    - profit
    description: Pre-calculated margin (Net Charges - Total Cost)
    expr: |-
      "Margin"
    data_type: FLOAT
    access_modifier: public_access
  - name: MIDMILE_COST
    synonyms:
    - mm cost
    description: Mid-mile transportation cost
    expr: |-
      "Midmile Cost"
    data_type: FLOAT
    access_modifier: public_access
  - name: MILKRUN_COST
    description: Milkrun delivery cost
    expr: |-
      "Milkrun Cost"
    data_type: FLOAT
    access_modifier: public_access
  - name: MM_HANDLING
    description: Mid mile handling cost
    expr: |-
      "MM Handling"
    data_type: FLOAT
    access_modifier: public_access
  - name: NET_CHARGES
    synonyms:
    - revenue
    - net revenue
    description: Total net revenue charges
    expr: |-
      "Net Charges"
    data_type: FLOAT
    access_modifier: public_access
  - name: OTHER_COSTS
    description: Other miscellaneous costs
    expr: |-
      "Other Costs"
    data_type: FLOAT
    access_modifier: public_access
  - name: PICKUP_COST
    description: Total pickup cost
    expr: |-
      "Pickup Cost"
    data_type: FLOAT
    access_modifier: public_access
  - name: TOTAL_COST
    synonyms:
    - cost
    description: Total cost of the shipment
    expr: |-
      "Total Cost"
    data_type: FLOAT
    access_modifier: public_access
  - name: TOT_CHRGWT
    synonyms:
    - billed weight
    - volume
    - weight
    description: Total billed weight in kg
    expr: |-
      "TOT_CHRGWT"
    data_type: FLOAT
    access_modifier: public_access
  - name: TOT_PHYWT
    description: Total physical weight in kg
    expr: |-
      "TOT_PHYWT"
    data_type: FLOAT
    access_modifier: public_access
  - name: TOT_VOLWT
    description: Total volumetric weight
    expr: |-
      "TOT_VOLWT"
    data_type: FLOAT
    access_modifier: public_access
  metrics:
  - name: CPK
    synonyms:
    - cost per kg
    description: Cost Per Kg
    expr: |-
      SUM("Total Cost") / NULLIF(SUM("TOT_CHRGWT"), 0)
    access_modifier: public_access
  - name: MARGIN_PERCENTAGE
    synonyms:
    - margin pct
    - margin %
    description: Margin as percentage of revenue
    expr: |-
      SUM("Margin") / NULLIF(SUM("Net Charges"), 0) * 100
    access_modifier: public_access
  - name: SHIPMENT_COUNT
    synonyms:
    - awb count
    - shipments
    description: Number of shipments
    expr: |-
      COUNT("AWB No")
    access_modifier: public_access
  - name: TOTAL_COST_METRIC
    description: Total cost across all AWBs
    expr: |-
      SUM("Total Cost")
    access_modifier: public_access
  - name: TOTAL_DELIVERY_COST
    description: Total delivery cost
    expr: |-
      SUM("Delivery Cost")
    access_modifier: public_access
  - name: TOTAL_HANDLING_COST
    description: Total handling cost
    expr: |-
      SUM("Handling Cost")
    access_modifier: public_access
  - name: TOTAL_LINEHAUL_COST
    description: Total linehaul cost
    expr: |-
      SUM("Linehaul Cost")
    access_modifier: public_access
  - name: TOTAL_MARGIN
    synonyms:
    - margin
    - profit
    description: Total margin
    expr: |-
      SUM("Margin")
    access_modifier: public_access
  - name: TOTAL_MIDMILE_COST
    description: Total midmile cost
    expr: |-
      SUM("Midmile Cost")
    access_modifier: public_access
  - name: TOTAL_PICKUP_COST
    description: Total pickup cost
    expr: |-
      SUM("Pickup Cost")
    access_modifier: public_access
  - name: TOTAL_REVENUE
    synonyms:
    - revenue
    description: Total revenue across all AWBs
    expr: |-
      SUM("Net Charges")
    access_modifier: public_access
  - name: TOTAL_VOLUME
    synonyms:
    - volume
    - total weight
    description: Total billed weight volume in kg
    expr: |-
      SUM("TOT_CHRGWT")
    access_modifier: public_access
  - name: UNIQUE_CUSTOMERS
    description: Number of unique customers
    expr: |-
      COUNT(DISTINCT "Client Name")
    access_modifier: public_access
  - name: YIELD_RPK
    synonyms:
    - yield
    - rpk
    - revenue per kg
    description: Yield or Revenue Per Kg
    expr: |-
      SUM("Net Charges") / NULLIF(SUM("TOT_CHRGWT"), 0)
    access_modifier: public_access
  time_dimensions:
  - name: DELIVERY_DATE
    synonyms:
    - del date
    description: Delivery date
    expr: |-
      "Del Date2"
    data_type: TIMESTAMP_NTZ(9)
  - name: INSCAN_DATE
    description: InScan date
    expr: |-
      "InScan Date"
    data_type: TIMESTAMP_NTZ(9)
  - name: PICKUP_DATE
    synonyms:
    - pickup date
    description: Shipment pickup date
    expr: |-
      "PICKUPDATE"
    data_type: TIMESTAMP_NTZ(9)
- name: DAILY_LOAD
  description: Trip-level linehaul load details per AWB — loading/unloading cities, connection names, LH cost per shipment.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: DAILY_LOAD
  primary_key:
    columns:
    - DL_AWB
  dimensions:
  - name: DL_ARRIVAL_LOCATION
    description: Arrival hub (unloading)
    expr: |-
      "ARRIVAL_LOCATION (UnLoading)"
    data_type: VARCHAR(16777216)
  - name: DL_AWB
    description: AWB number
    expr: AWB
    data_type: VARCHAR(16777216)
  - name: DL_CLIENTNAME
    description: Client name
    expr: CLIENTNAME
    data_type: VARCHAR(16777216)
  - name: DL_CONNECTIONID
    description: Connection ID
    expr: |-
      "connectionid"
    data_type: VARCHAR(16777216)
  - name: DL_CONNECTION_NAME
    synonyms:
    - route name
    - connection
    description: Connection/route name
    expr: |-
      "final_connection_name"
    data_type: VARCHAR(16777216)
  - name: DL_DEPART_LOCATION
    description: Departure hub (loading)
    expr: |-
      "DEPART_LOCATION (Loading)"
    data_type: VARCHAR(16777216)
  - name: DL_DESTHUB
    description: Destination hub
    expr: DESTHUB
    data_type: VARCHAR(16777216)
  - name: DL_LOADING_CITY
    synonyms:
    - from city
    - origin city
    description: Loading city
    expr: |-
      "Loading_city"
    data_type: VARCHAR(16777216)
  - name: DL_MM_TRIPID
    description: Mid-mile trip ID
    expr: MM_TRIPID
    data_type: VARCHAR(16777216)
  - name: DL_ORIGINHUB
    description: Origin hub
    expr: ORIGINHUB
    data_type: VARCHAR(16777216)
  - name: DL_STOPPOINTHUBNAME
    description: Stop point hub name
    expr: STOPPOINTHUBNAME
    data_type: VARCHAR(16777216)
  - name: DL_UNLOADING_CITY
    synonyms:
    - to city
    - destination city
    description: Unloading city
    expr: |-
      "Unloading_city"
    data_type: VARCHAR(16777216)
  facts:
  - name: DL_LH_COST
    synonyms:
    - linehaul cost per awb
    description: Linehaul cost allocated to this AWB
    expr: |-
      "LH Cost"
    data_type: NUMBER(18,4)
    access_modifier: public_access
  - name: DL_STOPPOINTORDER
    description: Stop point order in trip
    expr: |-
      "stoppointorder"
    data_type: NUMBER(10,0)
    access_modifier: public_access
  - name: DL_TOT_CHRGWT
    synonyms:
    - load weight
    - trip weight
    description: Billed weight per AWB on this trip
    expr: TOT_CHRGWT
    data_type: NUMBER(18,4)
    access_modifier: public_access
  - name: DL_TOT_PHYWT
    description: Physical weight per AWB
    expr: TOT_PHYWT
    data_type: NUMBER(18,4)
    access_modifier: public_access
  - name: DL_TOT_VOLWT
    description: Volumetric weight per AWB
    expr: TOT_VOLWT
    data_type: NUMBER(18,4)
    access_modifier: public_access
  metrics:
  - name: DL_AWB_COUNT
    description: Unique AWBs on trips
    expr: COUNT(DISTINCT AWB)
    access_modifier: public_access
  - name: DL_LH_CPK
    description: Linehaul cost per kg
    expr: |-
      SUM("LH Cost") / NULLIF(SUM(TOT_CHRGWT), 0)
    access_modifier: public_access
  - name: DL_TOTAL_LH_COST
    description: Total linehaul cost across trips
    expr: |-
      SUM("LH Cost")
    access_modifier: public_access
  - name: DL_TOTAL_LOAD
    description: Total load (billed weight) on trips
    expr: SUM(TOT_CHRGWT)
    access_modifier: public_access
  time_dimensions:
  - name: DL_TRIP_CLOSE_DATE
    description: Trip close date
    expr: |-
      "Trip_close_date"
    data_type: TIMESTAMP_NTZ(9)
  - name: DL_TRIP_START_DATE
    description: Trip start date
    expr: |-
      "Trip_start_date"
    data_type: TIMESTAMP_NTZ(9)
- name: DIM_HUB_CITY
  description: Hub to city and territory mapping.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: DIM_HUB_CITY
  primary_key:
    columns:
    - HUB_NAME
  dimensions:
  - name: HUB_CITY
    description: Hub city
    expr: |-
      "HubCity"
    data_type: VARCHAR(16777216)
  - name: HUB_NAME
    description: Hub name code
    expr: |-
      "HubName"
    data_type: VARCHAR(16777216)
  - name: HUB_STATE
    description: Hub state
    expr: |-
      "HubState"
    data_type: VARCHAR(16777216)
  - name: HUB_TERRITORY
    description: Hub territory
    expr: |-
      "Territory"
    data_type: VARCHAR(16777216)
- name: DIM_HUB_TO_ZONE
  description: Hub to zone mapping.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: DIM_HUB_TO_ZONE
  primary_key:
    columns:
    - HUB_NAME_ZONE
  dimensions:
  - name: CENTER_TYPE
    description: Center type (Hub/SVC)
    expr: |-
      "centertype"
    data_type: VARCHAR(16777216)
  - name: HUB_NAME_ZONE
    description: Hub name
    expr: |-
      "hubname"
    data_type: VARCHAR(16777216)
  - name: HUB_ZONE_NAME
    synonyms:
    - zone
    description: Zone name
    expr: |-
      "hubzonename"
    data_type: VARCHAR(16777216)
- name: FM_JOURNEY
  description: First mile journey details.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: FM_JOURNEY
  primary_key:
    columns:
    - AWB
  dimensions:
  - name: AWB
    description: AWB number
    expr: |-
      TRIM("AWB")
    data_type: VARCHAR(16777216)
  - name: FM_TRIPID
    description: First mile trip ID
    expr: |-
      "FM_TRIPID"
    data_type: VARIANT
  - name: ODA_NORMAL
    description: ODA or Normal classification
    expr: |-
      "ODA/NORMAL"
    data_type: VARCHAR(16777216)
  - name: ORIGINHUB
    description: Origin hub
    expr: |-
      "ORIGINHUB"
    data_type: VARCHAR(16777216)
  - name: PICKUPPINCODE
    description: Pickup pincode
    expr: |-
      "PICKUPPINCODE"
    data_type: FLOAT
  time_dimensions:
  - name: PICKUPDATE
    description: Pickup date
    expr: |-
      "PICKUPDATE"
    data_type: TIMESTAMP_NTZ(9)
- name: LM_JOURNEY
  description: Last mile journey details.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: LM_JOURNEY
  primary_key:
    columns:
    - AWB
  dimensions:
  - name: APPT_NORMAL
    description: Appointment or Normal
    expr: |-
      "APPT/NORMAL"
    data_type: VARCHAR(16777216)
  - name: AWB
    description: AWB number
    expr: |-
      TRIM("AWB")
    data_type: VARCHAR(16777216)
  - name: DELIVERYPINCODE
    description: Delivery pincode
    expr: |-
      "DELIVERYPINCODE"
    data_type: FLOAT
  - name: DESTHUB
    description: Destination hub
    expr: |-
      "DESTHUB"
    data_type: VARCHAR(16777216)
  - name: LM_TRIPID
    description: Last mile trip ID
    expr: |-
      "LM_TRIPID"
    data_type: VARIANT
  - name: ODA_NORMAL_LM
    description: ODA or Normal
    expr: |-
      "ODA/NORMAL"
    data_type: VARCHAR(16777216)
  facts:
  - name: TOTALATTEMPTCOUNT
    description: Total delivery attempts
    expr: |-
      "TOTALATTEMPTCOUNT"
    data_type: FLOAT
    access_modifier: public_access
  time_dimensions:
  - name: DELIVERYDATETIME
    description: Delivery date and time
    expr: |-
      TRY_TO_TIMESTAMP("DELIVERYDATETIME"::VARCHAR)
    data_type: TIMESTAMP_NTZ(9)
- name: MM_JOURNEY
  description: Mid-mile journey details — trip connections, loading/unloading hubs, connection types.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: MM_JOURNEY
  primary_key:
    columns:
    - MM_AWB
  dimensions:
  - name: MM_ARRIVAL_LOCATION
    description: Arrival/unloading hub
    expr: |-
      "ARRIVAL_LOCATION (UnLoading)"
    data_type: VARCHAR(16777216)
  - name: MM_AWB
    description: AWB number
    expr: TRIM(AWB)
    data_type: VARCHAR(16777216)
  - name: MM_CONNECTIONID
    description: Connection ID
    expr: CONNECTIONID
    data_type: VARIANT
  - name: MM_CONNECTIONTYPE
    description: Connection type (Local/Network)
    expr: CONNECTIONTYPE
    data_type: VARCHAR(16777216)
    sample_values:
    - Local Connection
    - Network Connection
  - name: MM_DEPART_LOCATION
    description: Departure/loading hub
    expr: |-
      "DEPART_LOCATION (Loading)"
    data_type: VARCHAR(16777216)
  - name: MM_TRIPID
    description: Mid-mile trip ID
    expr: MM_TRIPID
    data_type: VARIANT
  facts:
  - name: MM_TRIP_ORDER
    description: Trip leg order in the journey
    expr: |-
      "TRIP ORDER"
    data_type: FLOAT
    access_modifier: public_access
- name: WEIGHTED_UTILIZATION
  description: Vehicle/trip-level utilization metrics — capacity, actual load, utilization %, trip cost, cost per kg.
  base_table:
    database: XPRESSBEES_PROFITABILITY
    schema: RAW
    table: WEIGHTED_UTILIZATION
  primary_key:
    columns:
    - WU_TRIPSHEETNO
  dimensions:
  - name: WU_CONNECTIONID
    description: Connection ID
    expr: |-
      "connectionid"
    data_type: VARCHAR(16777216)
  - name: WU_CONNECTION_NAME
    synonyms:
    - route
    - connection
    description: Connection/route name
    expr: |-
      "Final connection name"
    data_type: VARCHAR(16777216)
  - name: WU_DEDICATED_ROUTE
    description: Dedicated route mapping
    expr: |-
      "Dedicated Route as per Mapping"
    data_type: VARCHAR(16777216)
  - name: WU_LANE
    synonyms:
    - od pair
    - route lane
    description: Lane (origin-destination pair)
    expr: |-
      "Lane"
    data_type: VARCHAR(16777216)
  - name: WU_LOAD_UNLOAD_CITY
    description: Loading/unloading city
    expr: |-
      "load_unloadcity"
    data_type: VARCHAR(16777216)
  - name: WU_ROUTE_TYPE
    synonyms:
    - national regional
    description: Route type (National/Regional)
    expr: |-
      "Route type"
    data_type: VARCHAR(16777216)
    sample_values:
    - National
    - Regional
  - name: WU_TRIPSHEETNO
    description: Trip sheet number
    expr: |-
      "TripSheetNo"
    data_type: VARCHAR(16777216)
  - name: WU_VEHICLE_NAME
    synonyms:
    - vehicle
    - truck type
    description: Vehicle type/name
    expr: |-
      "vehiclename"
    data_type: VARCHAR(16777216)
  - name: WU_VENDOR_NAME
    description: Vehicle vendor name
    expr: |-
      "Vendor_Name"
    data_type: VARCHAR(16777216)
  facts:
  - name: WU_CHG_WT
    description: Charged weight loaded
    expr: |-
      TRY_TO_NUMBER("Chg Wt", 18, 2)
    data_type: NUMBER(18,2)
    access_modifier: public_access
  - name: WU_DISTANCE
    description: Trip distance
    expr: |-
      TRY_TO_NUMBER("Dist.", 18, 2)
    data_type: NUMBER(18,2)
    access_modifier: public_access
  - name: WU_PHY_CAP
    description: Physical weight capacity
    expr: |-
      TRY_TO_NUMBER("Phy Cap", 18, 2)
    data_type: NUMBER(18,2)
    access_modifier: public_access
  - name: WU_PHY_WT
    description: Physical weight loaded
    expr: |-
      TRY_TO_NUMBER("Phy Wt", 18, 2)
    data_type: NUMBER(18,2)
