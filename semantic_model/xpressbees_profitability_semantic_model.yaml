- name: margin_trend_by_customer
  question: What is the margin trend for a customer by month?
  sql: |
    SELECT DATE_TRUNC('month', "PICKUPDATE") AS month,
      SUM("\1") AS revenue,
      SUM("\1") AS margin,
      SUM("\1") / NULLIF(SUM("\1"), 0) * 100 AS margin_pct,
      SUM("\1") AS volume_kg
    FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
    WHERE "Client Name" = '<CLIENT_NAME>'
    GROUP BY month ORDER BY month
module_custom_instructions:
  sql_generation: 'Revenue = Net Charges column. Margin = pre-calculated Margin column. Margin% = SUM(Margin)/NULLIF(SUM(Net Charges),0)*100. CPK = SUM(Total Cost)/NULLIF(SUM(TOT_CHRGWT),0). Yield/RPK = SUM(Net Charges)/NULLIF(SUM(TOT_CHRGWT),0). Volume = TOT_CHRGWT (billed weight kg). National vs Regional: National means Origin_Terr != Dest_Terr (cross-territory). Regional means Origin_Terr = Dest_Terr (same territory). Do NOT use Route column for national/regional — it only has Surface. Top N: include revenue, margin, volume. 10 lakhs = 1000000. Numeric columns in B2B_REVENUE are FLOAT type - use directly. WU columns are VARCHAR - use TRY_TO_NUMBER() for WU aggregations only. Cost RCA: break Total Cost into Pickup, Delivery, Linehaul, Midmile, Handling, Common, Other costs.'
