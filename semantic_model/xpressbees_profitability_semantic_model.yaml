- name: top5_od_negative_margin_per_customer
  question: Top 5 OD pair wise lanes contributing to negative margin in top 10 negative margin customers
  sql: |
    WITH neg_customers AS (
      SELECT "Client Name"
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      GROUP BY "Client Name"
      HAVING SUM("\1") > 1000000
        AND SUM("\1") < 0
      ORDER BY SUM("\1") ASC
      LIMIT 10
    ),
    ranked AS (
      SELECT b."Client Name",
        b."Origin_City" || '-' || b."Dest_City" AS od_pair,
        SUM(b."\1") AS revenue,
        SUM(b."\1") AS margin,
        ROW_NUMBER() OVER (PARTITION BY b."Client Name" ORDER BY SUM(b."\1") ASC) AS rn
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE b
      INNER JOIN neg_customers nc ON b."Client Name" = nc."Client Name"
      GROUP BY b."Client Name", b."Origin_City", b."Dest_City"
      HAVING SUM(b."\1") < 0
    )
    SELECT "Client Name", od_pair, revenue, margin
    FROM ranked WHERE rn <= 5
    ORDER BY "Client Name", margin ASC
