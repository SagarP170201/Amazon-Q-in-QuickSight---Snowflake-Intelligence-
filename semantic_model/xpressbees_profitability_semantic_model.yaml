- name: yoy_growth_top_clients
  question: YoY growth for top clients
  sql: |
    WITH this_year AS (
      SELECT "Client Name", SUM("\1") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE YEAR("PICKUPDATE") = YEAR(CURRENT_DATE())
      GROUP BY "Client Name"
    ),
    last_year AS (
      SELECT "Client Name", SUM("\1") AS revenue
      FROM XPRESSBEES_PROFITABILITY.RAW.B2B_REVENUE
      WHERE YEAR("PICKUPDATE") = YEAR(CURRENT_DATE()) - 1
      GROUP BY "Client Name"
    )
    SELECT t."Client Name", t.revenue AS current_year, l.revenue AS last_year,
      (t.revenue - COALESCE(l.revenue, 0)) / NULLIF(l.revenue, 0) * 100 AS yoy_growth_pct
    FROM this_year t LEFT JOIN last_year l ON t."Client Name" = l."Client Name"
